<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindi Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- Installable standalone app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071A1B">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hindi Tutor">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <button id="backBtn" class="icon-btn" type="button" aria-label="Back" style="display:none;">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="brand-mark" aria-hidden="true">ह</span>
        <div class="brand-text">
          <h1>Hindi Tutor</h1>
          <p id="topbarSub">Spoken Hindi for Tamil speakers</p>
        </div>
      </div>
      <div class="row" style="gap:8px;">
        <button id="helpBtn" class="icon-btn" type="button" aria-label="How this app works">
          <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.3 9.4a2.7 2.7 0 1 1 4 2.3c-1 .6-1.4 1.1-1.4 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="17.3" r="1" fill="currentColor"/></svg>
        </button>
        <button id="streakChip" class="streak-chip" type="button" aria-label="Practice streak">
          <span class="flame">🔥</span><span id="streakCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <button id="scrollFab" class="scroll-fab" type="button" aria-label="Scroll down" style="display:none;">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 11.5 12 4l8 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V20h12v-9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="library">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5.5c2-1 5-1 7 0v14c-2-1-5-1-7 0v-14Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M20 5.5c-2-1-5-1-7 0v14c2-1 5-1 7 0v-14Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Library</span>
    </button>
    <button class="tab" data-tab="practice">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="4" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Practice</span>
    </button>
    <button class="tab" data-tab="tutor">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3 3 8v2c0 5.5 3.8 9.7 9 11 5.2-1.3 9-5.5 9-11V8l-9-5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12.3l2 2 4-4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Tutor</span>
    </button>
    <button class="tab" data-tab="tasks">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Tasks</span>
    </button>
    <button class="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Progress</span>
    </button>
  </nav>
</div>

<script src="data/sentences300.js"></script>
<script src="data/verbBank.js"></script>
<script src="data/tasksMaterial.js"></script>
<script src="data/grammarPatterns.js"></script>
<script src="data/genderTable.js"></script>
<script src="data/exceptionsTable.js"></script>
<script src="data/taskDecks.js"></script>
<script src="data/scenarios.js"></script>
<script src="data/lifeScenarios.js"></script>
<script src="data/extraVocab.js"></script>
<script src="data/compoundVerbs.js"></script>
<script src="data/sentenceFormulas.js"></script>
<script src="data/learningPath.js"></script>
<script src="data/similarWords.js"></script>
<script src="data/formulaLab.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        /* registration can fail inside a preview iframe - the app still works, just without
           the offline/installable upgrade; opening the artifact's own tab fixes this */
      });
    });
  }
</script>

</body></html>
